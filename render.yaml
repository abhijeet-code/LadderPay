services:
  # Standalone Backend (Drunix Orchestrator & NPCI Rails Simulator)
  - type: web
    name: ladderpay-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RPC_URL
        value: https://rpc-amoy.polygon.technology/
